<!doctype html>
<html>
  <head>
    <title>Super page de test</title>
  </head>
  <body>

    <p>Navigating to <span id="value">{value}</span></p>
    <p>Slider value <span id="slider"></span></p>
    <script>
      const ws = new WebSocket("ws://localhost:1234");

      ws.onmessage = (e) => {
        let {command, data} = JSON.parse(e.data);
        console.log(command, data);
        if (command === "state") document.getElementById("value").innerHTML = data;
        if (command === "production") document.getElementById("slider").innerHTML = data;
      };
    </script>
  </body>
</html>
