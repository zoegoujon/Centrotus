<!DOCTYPE html>
<html lang="fr">
<link rel="stylesheet" href="/src/styles/accueil.css"/>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap">
    <title>Accueil - Centrotus</title>
</head>

<body>
    <div id="app">
        <h1>Centrotus</h1>
        <p>Cliquez pour commencer</p>
    </div>
     <script>
        document.body.addEventListener("click", function() {
            window.location.href = "/erosion";
        });

        const ws = new WebSocket("ws://localhost:1234");

        ws.addEventListener("open", () => {
            ws.send(JSON.stringify({command: "reset"}));
        });
    </script>
</body>
</html>
