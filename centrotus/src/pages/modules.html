<!DOCTYPE html>
<html lang="fr">
<link rel="stylesheet" href="/src/styles/modules.css"/>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap">
    <title>Modules - Centrotus</title>
</head>
<body>
    <div id="app">
        <h1>Modules</h1>
        <ul id="modules_affiches">
            <li id="flotteurs" style="visibility: hidden;">
                <img src="/src/img/flotteurs.png" alt="Flotteurs" width="300px"/>
            </li>
            <li id="algues" style="visibility: hidden;">
                <img src="/src/img/algues.png" alt="Algues" width="300px"/>
            </li>
            <li id="oursins" style="visibility: hidden;">
                <img src="/src/img/oursins.png" alt="Oursins" width="300px"/>
            </li>
            <li id="void" style="visibility: hidden;">
            </li>
        </ul> 
        <ul id="menu-boutons" style="visibility: hidden;">
        </ul>
        <p id="module-description"></p>       
    </div>
    <div id="popup" style="visibility: hidden;">
        <p>L'animation va se réinitialiser dans 10 secondes.</p>
        <p>Appuyer sur un des boutons pour continuer à explorer avec les modules ou sur l'écran pour quitter.</p>
    </div>
    <div id="compteur">
        <p id="compteur-text"></p>
        <p id="unite">GWh</p>
    </div>
    <script type="module" src="/src/script/modules.js"></script>
    <script type="module" src="/src/script/exit.js"></script>
</body>
</html>
