<!doctype html>
<html>
  <head>
    <title>Super page de test</title>
  </head>
  <body>

    Navigating to <p id="value">{value}</p>

    <script>
      const ws = new WebSocket("ws://localhost:1234");

      ws.onmessage = (e) => {
        let {command, data} = JSON.parse(e.data);
        console.log(command, data)
        if (command === "go") document.getElementById("value").innerHTML = data;
      };
    </script>
  </body>
</html>
